<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef8ff"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>運動管理</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef8ff;color:#26384a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.app{max-width:520px;margin:auto;padding:12px}.head{display:flex;align-items:center;gap:10px;padding:5px 4px 13px}.mascot{width:54px;height:54px}.title{font-size:23px;font-weight:800}.sub{font-size:12px;color:#718096}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 3px 14px #6e96b426}.st{font-size:18px;font-weight:800;margin-bottom:11px}.nav{display:flex;gap:6px;margin-bottom:10px}.nav button,.btn{flex:1;border:0;border-radius:10px;padding:10px;background:#edf3f7;color:#26384a}.nav .now,.primary{background:#dff1ff;font-weight:700}.week{margin:10px 0}.wl{font-size:12px;font-weight:800;margin-bottom:4px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.dow{text-align:center;font-size:10px;color:#718096}.day{min-height:67px;border:1px solid #dce8f0;border-radius:9px;text-align:center;padding:3px;background:#fff}.today{border:2px solid #75b9e8;background:#eaf6ff}.date{font-size:11px;font-weight:800}.icons{display:flex;justify-content:center;flex-wrap:wrap}.ico{border:0;background:transparent;padding:1px;font-size:18px}.hint{font-size:11px;color:#718096;margin-top:8px}.exercise{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ex{border:2px solid #ffd8b0;background:#fff7ef;border-radius:14px;padding:11px;text-align:left}.ex.g{border-color:#bde8ca;background:#effaf2}.ex.b{border-color:#bfdcff;background:#eef6ff}.exb{font-size:15px;font-weight:800}.meta{font-size:11px;color:#718096;margin-top:5px}.sum{display:grid;grid-template-columns:1fr 1fr;gap:7px}.s{padding:10px;border-radius:12px;background:#f7fafc;border-left:5px solid}.o{border-color:#f59b42}.g{border-color:#59b978}.b{border-color:#4d91e8}.overlay{display:none;position:fixed;inset:0;background:#0009;align-items:flex-end;z-index:5}.modal{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}.close{float:right;border:0;border-radius:50%;padding:7px}.set{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin:7px 0}.set input,.run input{width:100%;padding:9px;border:1px solid #dce8f0;border-radius:8px}.actions{display:flex;gap:7px;margin-top:13px}.actions .btn{flex:1}.danger{background:#fdecef!important;color:#a33}.footer{text-align:center;font-size:11px;color:#8795a3;padding:8px}</style></head>
<body><main class="app"><div class="head"><svg class="mascot" viewBox="0 0 64 64"><ellipse cx="32" cy="35" rx="19" ry="22" fill="#f2a51b" stroke="#5b4631" stroke-width="2"/><path d="M17 28Q7 14 4 23q8 3 13 10M47 28Q57 14 60 23q-8 3-13 10" fill="#e79a16" stroke="#5b4631" stroke-width="2"/><circle cx="25" cy="31" r="4" fill="white"/><circle cx="39" cy="31" r="4" fill="white"/><circle cx="25" cy="31" r="2"/><circle cx="39" cy="31" r="2"/><path d="M26 43Q32 48 38 43" fill="none" stroke="#5b4631" stroke-width="2"/></svg><div><div class="title">運動管理</div><div class="sub">今日も無理せずコツコツやで！</div></div></div>
<section class="card"><div class="st">カレンダー</div><div class="nav"><button onclick="move(-1)">← 1週前</button><button class="now" onclick="off=0;render()">今週</button><button onclick="move(1)">1週後 →</button></div><div id="cal"></div><div class="hint">実施アイコンをタップすると、その日の内容を確認できます。</div></section>
<section class="card"><div class="st">今日のトレーニング</div><div class="exercise"><button class="ex" onclick="strength('腹筋')"><div class="exb">◒ 腹筋</div><div class="meta" id="m腹筋">タップして記録</div></button><button class="ex" onclick="strength('スクワット')"><div class="exb">◓ スクワット</div><div class="meta" id="mスクワット">タップして記録</div></button><button class="ex" onclick="strength('腕立て')"><div class="exb">↘ 腕立て</div><div class="meta" id="m腕立て">タップして記録</div></button><button class="ex" onclick="strength('かかと上げ')"><div class="exb">↥ かかと上げ</div><div class="meta" id="mかかと上げ">タップして記録</div></button><button class="ex g" onclick="stretch()"><div class="exb">🧘 ストレッチ</div><div class="meta" id="mstretch">タップして実施</div></button><button class="ex b" onclick="running()"><div class="exb">🏃 ランニング</div><div class="meta" id="mrun">距離・時間を記録</div></button></div></section>
<section class="card"><div class="st">今月の記録</div><div class="sum" id="sum"></div></section><div class="footer">記録はこの端末内に保存されます。</div></main>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<script>
const KEY="exercise-v2-pwa",D=JSON.parse(localStorage.getItem(KEY)||'{"days":{}}');let off=0;const E=["腹筋","スクワット","腕立て","かかと上げ"],IC=["◒","◓","↘","↥"];const fmt=d=>{let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),x=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+x},today=()=>fmt(new Date()),get=k=>D.days[k]||(D.days[k]={}),save=()=>{localStorage.setItem(KEY,JSON.stringify(D));render()};function mon(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()||7)+1);return d}function add(d,n){d=new Date(d);d.setDate(d.getDate()+n);return d}
function lastDate(t){let k=Object.keys(D.days).filter(k=>t==="s"?E.some(e=>D.days[k][e]?.sets?.length):t==="r"?D.days[k].run:D.days[k].stretch).sort();return k.length?new Date(k.at(-1)):null}function due(k,t){let l=lastDate(t);if(!l)return false;let d=new Date(k),df=Math.round((d-l)/86400000);return t==="t"?df===1:df===3}
function render(){let s=add(mon(new Date()),off*7-7),out="",dn=["月","火","水","木","金","土","日"],tk=today();for(let w=0;w<3;w++){let a=add(s,w*7),z=add(a,6);out+=`<div class="week"><div class="wl">${a.getFullYear()}/${a.getMonth()+1}/${a.getDate()} ～ ${z.getMonth()+1}/${z.getDate()}</div><div class="cal">${dn.map(x=>`<div class="dow">${x}</div>`).join("")}`;for(let i=0;i<7;i++){let d=add(a,i),k=fmt(d),x=D.days[k]||{},icons=[];E.forEach((e,j)=>{if(x[e]?.sets?.length)icons.push(`<button class="ico" onclick="detail('${k}')">${IC[j]}</button>`)});if(x.stretch)icons.push(`<button class="ico" onclick="detail('${k}')">🧘</button>`);if(x.run)icons.push(`<button class="ico" onclick="detail('${k}')">🏃</button>`);let dueI=[];if(due(k,"s"))dueI.push("💪");if(due(k,"t"))dueI.push("🧘");if(due(k,"r"))dueI.push("🏃");out+=`<div class="day ${k===tk?"today":""}"><div class="date">${d.getDate()}</div><div class="icons">${icons.length?icons.join(""):dueI.map(v=>`<span class="ico">${v}</span>`).join("")}</div></div>`}out+="</div></div>"}document.getElementById("cal").innerHTML=out;E.forEach(e=>{let x=D.days[tk]?.[e];document.getElementById("m"+e).textContent=x?.sets?.length?x.sets.map(v=>v+"回").join(" / "):"タップして記録"});document.getElementById("mstretch").textContent=D.days[tk]?.stretch?"実施済み（タップで取消）":"タップして実施";let r=D.days[tk]?.run;document.getElementById("mrun").textContent=r?`${r.d}km / ${r.t} / ${r.p}/km`:"距離・時間を記録";summary()}function move(n){off+=n;render()}
function modal(x){document.getElementById("modal").innerHTML=x;document.getElementById("ov").style.display="flex"}function close(){document.getElementById("ov").style.display="none"}document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")close()}
function lastSets(e){let k=Object.keys(D.days).filter(k=>D.days[k][e]?.sets?.length).sort();return k.length?D.days[k.at(-1)][e].sets:[10]}function setrow(v,i){return `<div class="set"><div>セット${i+1}</div><input type="number" min="1" value="${v}" class="rep"><button class="btn danger" onclick="this.parentElement.remove()">削除</button></div>`}
function strength(e){let s=D.days[today()]?.[e]?.sets||lastSets(e);modal(`<button class="close" onclick="close()">×</button><h2>${e}を記録</h2><div id="sets">${s.map((v,i)=>setrow(v,i)).join("")}</div><button class="btn" onclick="addSet()">＋セットを追加</button><div class="actions"><button class="btn" onclick="close()">キャンセル</button><button class="btn primary" onclick="saveS('${e}')">保存</button></div>`)}function addSet(){let n=document.querySelectorAll(".set").length;document.getElementById("sets").insertAdjacentHTML("beforeend",setrow(10,n))}function saveS(e){let a=[...document.querySelectorAll(".rep")].map(x=>+x.value).filter(x=>x>0);get(today())[e]={sets:a};save();close()}
function stretch(){if(!get(today()).stretch){get(today()).stretch=true;save()}else modal(`<h2>実施を取り消しますか？</h2><div class="actions"><button class="btn" onclick="close()">NO</button><button class="btn danger" onclick="get(today()).stretch=false;save();close()">YES</button></div>`)}
function lastRun(){let k=Object.keys(D.days).filter(k=>D.days[k].run).sort();return k.length?D.days[k.at(-1)].run:null}function sec(s){let p=s.split(":").map(Number);return p.length===2?p[0]*60+p[1]:(+s||0)*60}function ff(s){return Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0")}function pace(){let d=+document.getElementById("rd")?.value,t=sec(document.getElementById("rt")?.value||"");if(d>0)document.getElementById("rp").value=ff(t/d)}
function running(){let r=D.days[today()]?.run||lastRun()||{d:"",t:""};modal(`<button class="close" onclick="close()">×</button><h2>ランニングを記録</h2><div class="run">距離(km)<input id="rd" type="number" min="0" step="0.01" value="${r.d}"><br><br>タイム（分:秒）<input id="rt" value="${r.t}" placeholder="30:00"><br><br>1kmあたりのタイム<input id="rp" readonly value="${r.p||""}"></div><div class="actions"><button class="btn" onclick="close()">キャンセル</button><button class="btn primary" onclick="saveR()">保存</button></div>`);rd.oninput=pace;rt.oninput=pace;pace()}function saveR(){let d=+rd.value,t=rt.value;if(d<=0||sec(t)<=0)return alert("距離とタイムを入力してください。");get(today()).run={d,t,p:ff(sec(t)/d)};save();close()}
function detail(k){let x=D.days[k]||{},h=E.map(e=>x[e]?.sets?.length?`<p><b>${e}</b>：${x[e].sets.map((v,i)=>`${i+1}セット ${v}回`).join("、")}</p>`:"").join("");if(x.stretch)h+="<p><b>ストレッチ</b>：実施</p>";if(x.run)h+=`<p><b>ランニング</b>：${x.run.d}km / ${x.run.t} / ${x.run.p}/km</p>`;modal(`<button class="close" onclick="close()">×</button><h2>${k.replaceAll("-","/")}</h2>${h||"記録はありません。"}`)}
function summary(){let n=new Date(),c={};E.forEach(e=>c[e]=0);c.s=0;c.r=0;Object.entries(D.days).forEach(([k,x])=>{let d=new Date(k);if(d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()){E.forEach(e=>{if(x[e]?.sets?.length)c[e]++});if(x.stretch)c.s++;if(x.run)c.r++}});document.getElementById("sum").innerHTML=E.map(e=>`<div class="s o"><b>${e}</b><br><small>${c[e]}回実施</small></div>`).join("")+`<div class="s g"><b>ストレッチ</b><br><small>${c.s}日実施</small></div><div class="s b"><b>ランニング</b><br><small>${c.r}回実施</small></div>`)}if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});render();
</script></body></html>
